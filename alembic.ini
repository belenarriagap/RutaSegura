# Configuración de Alembic para desarrollo (crear nuevas migraciones).
# La aplicación no usa este archivo: aplica las migraciones al abrir la base de datos.
#
#   uv run alembic revision --autogenerate -m "descripcion" --rev-id 0002
#
[alembic]
script_location = rutasegura/data/migrations
file_template = v%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///dev_migraciones.db
prepend_sys_path = .

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
