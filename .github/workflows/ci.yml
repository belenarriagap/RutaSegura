name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos y pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Librerías de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependencias (fijadas en uv.lock)
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (formato)
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Pytest (sin red)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
