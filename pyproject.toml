[project]
name = "rutasegura"
version = "0.1.0"
description = "Simulación offline de evacuación ante sismos a partir del plano 2D de un local."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Propietario - uso académico" }
dependencies = [
    "alembic>=1.20.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=2.1",
    "pyside6-essentials>=6.12.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
rutasegura = "rutasegura.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rutasegura"]

# ---------------------------------------------------------------- uv
[tool.uv]
# Las versiones exactas quedan fijadas en uv.lock (ver docs/decisiones.md, ADR-002).

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff
    "NPY",      # numpy (incluye NPY002: prohíbe np.random.seed y API global)
    "PT",       # pytest
    "TID",      # tidy imports
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textos en español con caracteres ambiguos (á, ñ, –)
]

[tool.ruff.lint.isort]
known-first-party = ["rutasegura", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Usa numpy.random.Generator creado con la semilla del escenario."
"numpy.random.seed".msg = "Usa numpy.random.default_rng(semilla)."

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["rutasegura", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["rutasegura.domain.*", "rutasegura.engines.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--disable-socket",
    "--strict-markers",
    "-ra",
]
markers = [
    "benchmark: pruebas de rendimiento (lentas)",
]
qt_api = "pyside6"

[tool.coverage.run]
source = ["rutasegura"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
